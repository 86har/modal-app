<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>画像ビューアー</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div id="viewer">
    <img id="img" src="/image?nocache={{ ts }}" draggable="false" title="ダブルクリックでお気に入りに保存" onerror="this.classList.add('img-broken')" onload="this.classList.remove('img-broken')">
    <div id="selection"></div>

    <button id="prevBtn" class="nav-arrow nav-prev" type="button" title="前の画像へ" aria-label="前の画像へ">&#10094;</button>
    <button id="nextBtn" class="nav-arrow nav-next" type="button" title="次の画像へ" aria-label="次の画像へ">&#10095;</button>
  </div>

  <div id="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-section-label">プレビュー</div>
      <div id="sidebarPreviewWrap" title="ホイールで前後の画像に切替">
        <img id="sidebarPreviewImg" src="" alt="" title="ダブルクリックでお気に入りに保存" onerror="this.classList.add('img-broken')" onload="this.classList.remove('img-broken')">
      </div>
      <div id="sidebarFilename">-</div>
      <div id="sidebarInfo">
        <button id="copyPromptBtn" class="copy-prompt-btn" type="button">プロンプトをコピー</button>
        <div class="info-row">
          <span class="info-label">解像度</span>
          <span class="info-value" id="infoRes">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">ファイルサイズ</span>
          <span class="info-value" id="infoSize">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">追加日時</span>
          <span class="info-value" id="infoDate">-</span>
        </div>
      </div>
    </div>

    <div class="sidebar-bottom">
      <div id="favoriteFolderBlock" class="favorite-folder-block">
        <div id="favoriteFolderRow" class="sidebar-row">
          <span class="sidebar-row-label">お気に入り画像の保存先を指定する</span>
          <button id="favoriteFolderBtn" class="favorite-folder-btn" type="button">選択</button>
        </div>
        <div id="favoriteFolderPath" class="favorite-folder-path">未設定</div>
      </div>

      <label id="favoriteViewRow" class="sidebar-row">
        <span class="sidebar-row-label">お気に入りフォルダを表示</span>
        <span class="switch">
          <input type="checkbox" id="favoriteViewToggle">
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </span>
      </label>

      <label id="autoSwitchRow" class="sidebar-row">
        <span class="sidebar-row-label">新しい画像を自動表示</span>
        <span class="switch">
          <input type="checkbox" id="autoSwitchToggle" checked>
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </span>
      </label>

      <div id="sidebarShortcuts">
        <div class="sidebar-section-label">ショートカット・操作</div>
        <ul class="shortcut-list">
          <li><kbd>ホイール</kbd><span>前後の画像に切替</span></li>
          <li><kbd>ドラッグ</kbd><span>移動（パン）</span></li>
          <li><kbd>クリック</kbd><span>ズーム解除（フィット）</span></li>
          <li><kbd>Ctrl</kbd> + ドラッグ<span>矩形ズーム</span></li>
          <li><kbd>ダブルクリック</kbd><span>お気に入り保存</span></li>
        </ul>
      </div>
    </div>
  </div>

  <div id="thumbStrip"></div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
