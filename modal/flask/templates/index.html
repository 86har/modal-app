<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>画像ビューアー</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div id="viewer">
    <img id="img" src="/image?nocache={{ ts }}" draggable="false">
    <div id="selection"></div>

    <button id="prevBtn" class="nav-arrow nav-prev" type="button" title="前の画像へ" aria-label="前の画像へ">&#10094;</button>
    <button id="nextBtn" class="nav-arrow nav-next" type="button" title="次の画像へ" aria-label="次の画像へ">&#10095;</button>
  </div>

  <div id="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-section-label">プレビュー</div>
      <div id="sidebarPreviewWrap">
        <img id="sidebarPreviewImg" src="" alt="">
      </div>
      <div id="sidebarFilename">-</div>
      <div id="sidebarInfo">
        <div class="info-row">
          <span class="info-label">解像度</span>
          <span class="info-value" id="infoRes">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">ファイルサイズ</span>
          <span class="info-value" id="infoSize">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">追加日時</span>
          <span class="info-value" id="infoDate">-</span>
        </div>
      </div>
    </div>

    <div id="sidebarShortcuts">
      <div class="sidebar-section-label">ショートカット・操作</div>
      <ul class="shortcut-list">
        <li><kbd>ホイール</kbd><span>ズームイン / アウト</span></li>
        <li><kbd>ドラッグ</kbd><span>移動（パン）</span></li>
        <li><kbd>クリック</kbd><span>ズーム解除（フィット）</span></li>
        <li><kbd>Ctrl</kbd> + ドラッグ<span>矩形ズーム</span></li>
      </ul>
    </div>
  </div>

  <div id="thumbStrip"></div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
